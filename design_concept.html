<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader - Design Concept</title>
    <style>
        :root {
            --bg-dark: #1e1e1e;
            --bg-sidebar: #252526;
            --bg-card: #2d2d30;
            --bg-input: #3c3c3c;
            --text-primary: #cccccc;
            --text-secondary: #858585;
            --accent: #007acc;
            --accent-hover: #0098ff;
            --border: #3e3e42;
            --success: #4ec9b0;
            --warning: #ce9178;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
        }

        .logo {
            padding: 0 20px 20px;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            border-bottom: 1px solid var(--border);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 24px;
            height: 24px;
            background-color: #ff0000;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
        }

        .nav-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .nav-item:hover {
            background-color: #2a2d2e;
            color: var(--text-primary);
        }

        .nav-item.active {
            background-color: #37373d;
            color: #ffffff;
            border-left: 3px solid var(--accent);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            height: 60px;
            background-color: var(--bg-dark);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 30px;
            font-size: 16px;
            font-weight: 500;
        }

        .content-area {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        /* Components */
        .card {
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 12px 15px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        .btn {
            padding: 0 20px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 42px;
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background-color: #454545;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        select {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px;
            color: white;
            outline: none;
        }

        /* Task Item */
        .task-item {
            background-color: #333333;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .task-title {
            font-weight: 500;
            font-size: 14px;
            color: white;
        }

        .progress-container {
            height: 6px;
            background-color: #252526;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--accent);
            width: 45%;
        }

        .task-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Icons placeholder */
        .icon {
            width: 16px;
            height: 16px;
            display: inline-block;
            background-color: currentColor;
            opacity: 0.7;
            mask-size: contain;
            -webkit-mask-size: contain;
        }
        
        /* Section Titles */
        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
            color: white;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">
            <div class="logo-icon">YT</div>
            Downloader
        </div>
        <div class="nav-item active">
            <span>⬇</span> 新建下载
        </div>
        <div class="nav-item">
            <span>⚡</span> 当前任务
            <span style="margin-left: auto; background: var(--accent); padding: 2px 6px; border-radius: 10px; font-size: 10px;">2</span>
        </div>
        <div class="nav-item">
            <span>🕒</span> 历史记录
        </div>
        <div class="nav-item">
            <span>⚙</span> 设置
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header">
            新建下载
        </div>

        <div class="content-area">
            <!-- Download Section -->
            <div class="card">
                <div class="section-title">视频链接</div>
                <div class="input-group">
                    <input type="text" placeholder="粘贴 YouTube 视频链接 (例如: https://www.youtube.com/watch?v=...)">
                    <button class="btn btn-secondary">分析链接</button>
                </div>
            </div>

            <div class="card">
                <div class="section-title">下载配置</div>
                <div class="options-grid">
                    <div class="form-group">
                        <label>下载格式</label>
                        <select>
                            <option>最佳质量 (MP4)</option>
                            <option>仅音频 (MP3)</option>
                            <option>1080p</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>保存位置</label>
                        <div style="display: flex; gap: 5px;">
                            <input type="text" value="~/Movies/yt-dlp" readonly>
                            <button class="btn btn-secondary" style="width: 40px;">...</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>字幕选项</label>
                        <select>
                            <option>无字幕</option>
                            <option>自动生成 (中文)</option>
                            <option>英文字幕</option>
                        </select>
                    </div>
                </div>
                
                <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
                    <button class="btn btn-primary" style="width: 200px; font-size: 16px;">
                        开始下载
                    </button>
                </div>
            </div>

            <!-- Active Tasks Preview -->
            <div style="margin-top: 30px;">
                <div class="section-title" style="font-size: 16px; opacity: 0.8;">正在进行 (2)</div>
                
                <!-- Task 1 -->
                <div class="task-item">
                    <div class="task-header">
                        <span class="task-title">Lofi Girl - beats to relax/study to</span>
                        <span style="color: var(--accent); cursor: pointer;">✕</span>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar" style="width: 45%;"></div>
                    </div>
                    <div class="task-meta">
                        <span>45.2 MB / 102.4 MB</span>
                        <span>2.1 MB/s • 剩余 28秒</span>
                    </div>
                </div>

                <!-- Task 2 -->
                <div class="task-item">
                    <div class="task-header">
                        <span class="task-title">Python Tutorial for Beginners - Full Course</span>
                        <span style="color: var(--accent); cursor: pointer;">✕</span>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar" style="width: 12%;"></div>
                    </div>
                    <div class="task-meta">
                        <span>120 MB / 1.2 GB</span>
                        <span>5.4 MB/s • 剩余 12分钟</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
